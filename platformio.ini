; One repository, two independent AVR firmwares, same on-wire protocol.
[platformio]
default_envs = indoor_uno, outdoor_pro8MHz

[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600

[env:indoor_uno]
board = uno
build_src_filter = +<indoor/> -<outdoor/>
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    adafruit/DHT sensor library@^1.4.2
    adafruit/Adafruit Unified Sensor@^1.1.4

[env:outdoor_pro8MHz]
board = pro8MHzatmega328
build_src_filter = +<outdoor/> -<indoor/>
lib_deps =
    adafruit/DHT sensor library@^1.4.2
    adafruit/Adafruit Unified Sensor@^1.1.4
    adafruit/Adafruit BMP280 Library@^2.6.0
    gyverlibs/GyverPower@^2.2.0

[env:outdoor_pickit2]
extends = env:outdoor_pro8MHz
upload_protocol = custom
upload_port = usb
upload_flags =
    -C
    $PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf
    -p
    $BOARD_MCU
    -P
    $UPLOAD_PORT
    -c
    pickit2
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i
